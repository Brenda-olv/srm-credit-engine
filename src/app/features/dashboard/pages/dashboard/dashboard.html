<section class="dashboard">

    <header class="dashboard-header">

        <h1>Dashboard</h1>

        <p>Visão geral das operações financeiras.</p>

    </header>

    <section class="cards" aria-label="Indicadores financeiros">

        <article class="card">

            <span class="card-label">Volume Total</span>

            <p class="card-value">
                R$ {{ volumeTotal | number:'1.2-2' }}
            </p>

        </article>

        <article class="card">

            <span class="card-label">Operações em USD</span>

            <p class="card-value">
                {{ operacoesUSD }}
            </p>

        </article>

        <article class="card">

            <span class="card-label">Spread Médio</span>

            <p class="card-value">
                {{ spreadMedio | number:'1.2-2' }}%
            </p>

        </article>

        <article class="card">

            <span class="card-label">Liquidações de Hoje</span>

            <p class="card-value">
                {{ liquidacoesHoje }}
            </p>

        </article>

    </section>

</section>
